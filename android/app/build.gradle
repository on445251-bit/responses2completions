plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'io.r2c.android'
    compileSdk 35

    defaultConfig {
        applicationId "io.r2c.android"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the artifact is installable as-is; swap in
            // your own keystore for anything distributed publicly.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA',
                         'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    // The proxy core lives outside the app module and is compiled into it, so both
    // the jar build and the APK build share one copy of the translation code.
    sourceSets {
        main {
            java.srcDirs += ['../src/main/java']
            // Exclude the CLI entry point: it uses System.exit and env vars.
            java.filter.exclude 'io/r2c/Main.java'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
}