plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'io.r2c.android'
    compileSdk 35

    defaultConfig {
        applicationId "io.r2c.android"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the artifact is installable as-is; swap in
            // your own keystore for anything distributed publicly.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA',
                         'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    // The proxy core lives outside the app module and is compiled into it, so both
    // the jar build and the APK build share one copy of the translation code.
    sourceSets {
        main {
            java.srcDirs += ['../src/main/java']
            // Exclude the CLI entry point: it uses System.exit and env vars.
            java.filter.exclude 'io/r2c/Main.java'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    // AppCompat pulls kotlin-stdlib, while older transitive paths still bring
    // kotlin-stdlib-jdk7/jdk8 (which re-package the same classes). Pinning the
    // platform BOM and forcing the merged artifacts removes the overlap.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin'
                && details.requested.name in ['kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8']) {
            // These are now empty shims pointing at kotlin-stdlib; force the
            // version so Gradle does not keep the old, duplicated ones.
            details.useVersion '1.9.24'
        }
    }
}