name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ desktop jar
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build fat jar
        run: mvn -B -q clean package

      - name: Show artifact
        run: |
          ls -lh target/*.jar
          java -jar target/responses2completions.jar --version

      - name: Self test (protocol translation)
        run: |
          chmod +x scripts/selftest.sh
          ./scripts/selftest.sh target/responses2completions.jar

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: responses2completions-jar
          path: target/responses2completions.jar
          if-no-files-found: error

  # ----------------------------------------------------------------------- apk
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          # GitHub's ubuntu runners ship the Android SDK, so no setup action is
          # needed. Only licences must be accepted and the platform installed, and
          # `yes` must feed the prompts (sdkmanager reads them from stdin).
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(which sdkmanager)"
          fi
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>&1 | tail -5
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Show artifact
        run: |
          find android/app/build/outputs -name '*.apk' -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: responses2completions-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # -------------------------------------------------------------------- release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ jar, apk ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p out
          find artifacts -name '*.jar' -exec cp {} out/ \;
          find artifacts -name '*.apk' -exec cp {} out/ \;
          ls -lh out

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*